[workspace]
members = [
    "alacritty",
    "alacritty_terminal",
    "alacritty_config",
    "alacritty_config_derive",
]
resolver = "2"

[workspace.package]
edition = "2024"
rust-version = "1.85.0"

[profile.release]
lto = "thin"
debug = 1
incremental = false

# Fork: distribution profile for the final optimized binary — full LTO,
# single codegen unit, stripped symbols. Builds to `target/dist/`.
#   dev iteration:  cargo build --release
#   final binary:   cargo build --profile dist   (or .\windows\dist.ps1)
# `.cargo/config.toml` adds `-C target-cpu=native` to every build, so the
# binary only runs on machines with the same CPU feature level.
[profile.dist]
inherits = "release"
lto = true
codegen-units = 1
strip = true

[workspace.dependencies]
toml = "0.9.11"
toml_edit = "0.24.0"

# TODO: Validation of fix for #6978. Remove before next release and use released `x11-clipboard`.
[patch.crates-io]
x11-clipboard = { git = "https://github.com/quininer/x11-clipboard.git", rev = "19ab2163cf0bd0db607e827a5214571990307866" }
