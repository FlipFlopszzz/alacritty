# Alacritty 配置 — 迁移自 Windows Terminal settings.json (2026-09)
# 保存后自动生效（live_config_reload），无需重启

[general]
live_config_reload = true

# ------------------------------------------------------------
#  Shell — Nushell（此前为 PowerShell 7 "pwsh.exe -NoLogo"）
# ------------------------------------------------------------
[terminal]
shell = { program = 'C:\Users\ASUS\AppData\Local\Programs\nu\bin\nu.exe', args = [] }

# ------------------------------------------------------------
#  窗口 — 同 WT defaults：padding 8、透明度 70%、120x30
# ------------------------------------------------------------
[window]
padding = { x = 8, y = 8 }
dynamic_padding = true
opacity = 0.93
dimensions = { columns = 120, lines = 30 }
# 注：WT 的 useAcrylic(亚克力模糊) Alacritty 在 Windows 上不支持，无法迁移

[scrolling]
history = 10000
# 滚轮每次滚动的行数（默认 3）
multiplier = 10

# ------------------------------------------------------------
#  字体 — SauceCodePro Nerd Font 14（同 WT）
# ------------------------------------------------------------
[font]
size = 14.0

[font.normal]
family = "SauceCodePro Nerd Font"
style = "Regular"

# ------------------------------------------------------------
#  光标 — WT 默认竖线（Alacritty 中叫 Beam）+ 闪烁动画
# ------------------------------------------------------------
[cursor]
style = { shape = "Beam", blinking = "on" }
# 失焦时光标保持原样式，不变空心方框
unfocused_hollow = false

[selection]
save_to_clipboard = false

# ------------------------------------------------------------
#  配色 — One Half Dark (modified)，与 WT scheme 逐项对应
# ------------------------------------------------------------
[colors.primary]
background = "#282C34"
foreground = "#DCDFE4"

[colors.cursor]
cursor = "#FFFFFF"

[colors.selection]
background = "#404859"
foreground = "#DCDFE4"

[colors.normal]
black   = "#23272E"
red     = "#E06C75"
green   = "#98C379"
yellow  = "#E5C07B"
blue    = "#61AFEF"
magenta = "#C678DD"
cyan    = "#56B6C2"
white   = "#DCDFE4"

[colors.bright]
black   = "#5A6374"
red     = "#E06C75"
green   = "#98C379"
yellow  = "#E5C07B"
blue    = "#61AFEF"
magenta = "#C678DD"
cyan    = "#56B6C2"
white   = "#DCDFE4"

# ------------------------------------------------------------
#  快捷键
#  Ctrl+C → Copy 配合 fork 的智能放行：有选区执行复制，无选区放行 ^C
#  中断命令；Ctrl+V → Paste 粘贴文本（bracketed paste），剪贴板是图片
#  时的空粘贴事件会让 CC 自己读剪贴板贴图
# ------------------------------------------------------------
[[keyboard.bindings]]
# shift+enter 发送 ESC+CR —— Claude Code 官方 /terminal-setup 写入的方案
key = "Return"
mods = "Shift"
chars = "\u001B\r"

[[keyboard.bindings]]
# ctrl+c → Copy：配合 fork 的智能放行——有选区复制，无选区放行 ^C 中断
# （Alacritty 默认没有 Ctrl+C 绑定，此绑定是智能行为的前提）
key = "C"
mods = "Control"
action = "Copy"

[[keyboard.bindings]]
# ctrl+v 官方 Paste：pwsh 里粘贴文本（bracketed paste）；剪贴板是图片时
# 空粘贴事件会让 CC 自己读剪贴板贴图（与 WT 的 Ctrl+V 行为一致）
key = "V"
mods = "Control"
action = "Paste"

[[keyboard.bindings]]
# ctrl+shift+t 新建窗口（同 WT/浏览器的"新建标签"习惯键位）
key = "T"
mods = "Control|Shift"
action = "CreateNewWindow"

[[keyboard.bindings]]
# ctrl+f 搜索（WT 是搜索条，Alacritty 是交互式高亮搜索）
key = "F"
mods = "Control"
action = "SearchForward"

[[keyboard.bindings]]
# ctrl+w 关闭窗口（同 WT；上游默认是 Super+W）。
# 代价：shell 里 Ctrl+W 的"删除前一个词"会被占用
key = "W"
mods = "Control"
action = "Quit"

# ------------------------------------------------------------
#  OSC 8 超链接 / URL
#  普通 shell 里：Ctrl+点击打开
#  CC 等 TUI 捕获鼠标时：Ctrl+Shift+点击（Shift 用于抑制鼠标上报，
#  官方设计如此，见 alacritty#8129）
# ------------------------------------------------------------
[[hints.enabled]]
regex = "(ipfs:|ipns:|magnet:|mailto:|gemini://|gopher://|https://|http://|news:|file:|git://|ssh:|ftp://)[^\u0000-\u001F\u007F-\u009F<>\"\\s{-}\\^⟨⟩`\\\\]+"
hyperlinks = true
post_processing = true
persist = false
mouse = { enabled = true, mods = "Control" }
binding = { key = "O", mods = "Control|Shift" }
command = { program = "cmd", args = ["/c", "start", ""] }

[mouse]
# 双击判定间隔（毫秒），按你的点击节奏调小可避免误触选词
double_click_interval = 250

# ------------------------------------------------------------
#  滚动条（fork 新增功能，Alacritty 官方没有）
#  mode: Never / Fading（滚动时浮现，duration 毫秒后淡出）/ Always（常驻，占一列宽）
# ------------------------------------------------------------
[scrollbar]
mode = "Always"
color = "#7f7f7f"
opacity = 0.5
duration = 2000
